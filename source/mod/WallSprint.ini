[WallSprint]
WALLSPRINT_ENABLE=1
WALLSPRINT_NATIVE_SOURCE_OVERRIDE=1
WALLSPRINT_ENTRY_DELAY=0.70
WALLSPRINT_ROTATE_TIME=0.25
; WS camera auto-centering (turn behind travel + aim at the hero). 0 = off (default, like the ground camera with
; auto-centering off), 1 = on.
WALLSPRINT_CAMERA_AUTOCENTER=0
; M8c: WS-only jump (no world-up boost at a WS jump-off; vanilla WR jumps unchanged). 1 = on, 0 = off.
WALLSPRINT_JUMP_CONFIG_WRITE=1
; M8g test: hide the pad A button (XInput) from the game during WS. 1 = on, 0 = off.
WALLSPRINT_JUMP_HOLDBACK_TEST=0
; M8j: WS charge jump with a controller (hold A during WS, release to jump). 1 = on, 0 = off.
WALLSPRINT_WS_CHARGE_JUMP=1
; M9b test: charge launch by a bounded write of the hero velocity (wall-normal). 1 = on, 0 = off.
WALLSPRINT_WS_VELOCITY_WRITE=0
; M9f test: small upward velocity probes of search candidates while falling (no WS). 1 = on, 0 = off.
WALLSPRINT_VELOCITY_PROBE=0
; M10c test: gravity toward the wall for 1.5 s after each WS jump. 1 = on, 0 = off.
WALLSPRINT_WS_GRAVITY_TEST=1
; M10f test: hold the gravity orientation on the wall for the whole WS and 1.5 s after it. 1 = on, 0 = off.
WALLSPRINT_WS_GRAVITY_DURING_WS=0
; M10q test: real wall gravity after a WS jump (per-frame position correction: world gravity off, gravity toward the wall). 1 = on, 0 = off.
WALLSPRINT_WS_GRAVITY_FORCE=1
; M10z-r9 test: drive the wall gravity through the game's own hero mover (collision kept, no position fight). 1 = on, 0 = off.
WALLSPRINT_WS_GRAVITY_MOVER=0
WALLSPRINT_ORIENTATION_WRITE=0
WALLSPRINT_ADHESION_WRITE=0
WALLSPRINT_MOVEMENT_WRITE=0
DEBUG_LOG=1
; v0.1c48 is a verified-WallRun read-only threshold diagnostic build.
; M2b (2026-11-04): accepted r4/r5 caller-local orientation source substitution is ON again (body Up = wall normal) so the
; sprint clip swapped into the WallRun loop stands on the wall. Actor Transform/movement/adhesion/gravity writes stay OFF.
; The c45 GravityOrientationOwner presence hook remains disabled after its bounded zero-hit result.
; c47 worker scalar observation remains, and c48 additionally counts exact pre-original Update entries where this+0x250 exceeds the two V8 consumer thresholds.
; The exact-entry probe performs one guarded 4-byte owner read, no pointer dereference, no game call, and no game write.
; No F11/F12 input or post-test waiting is required. F8 remains the emergency stop.

[Diagnostics]
ORIENTATION_SOURCE_DISCOVERY=1
SOURCE_ARGUMENT_CAPTURE=0
SOURCE_OTHER_ARGUMENT_SNAPSHOTS=0
SOURCE_WINDOW_MS=2000
ORIENTATION_WRITER_TRACE=0
WRITER_TRACE_WINDOW_MS=350
WALLRUN_HOOK_DIAGNOSTIC=1
WALLRUN_OBJECT_DIAGNOSTIC=1
HOOK_WALLRUN_INIT=1
HOOK_WALLRUN_ENTRY=1
HOOK_WALLRUN_UPDATE=1
HOOK_WALLRUN_DEINIT=1
REQUEST_PRESENCE_DIAGNOSTIC=0
SURFACE_PROBE_DIAGNOSTIC=0
ORIENTATION_DIAGNOSTIC=0
ORIENTATION_INTERVAL_MS=100
REFERENCE_AOB_AUDIT=1

[WallSprintSettings]
; Player-tunable values (read at game start; ModSettings will map onto these later). Missing key = default.
; Turn rate of the WS travel/facing in degrees per second (ground sprint measured max ~470).
TURN_RATE_DEG_PER_SEC=400
; Camera counts as player-controlled this many ms after a mouse move (auto-centering off holds the camera otherwise).
MOUSE_MANUAL_MS=150
; Right stick magnitude (0..1) that counts as player camera input.
STICK_MANUAL_THRESHOLD=0.2
