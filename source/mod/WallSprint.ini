[WallSprint]
WALLSPRINT_ENABLE=1
WALLSPRINT_NATIVE_SOURCE_OVERRIDE=1
WALLSPRINT_ENTRY_DELAY=0.70
WALLSPRINT_ROTATE_TIME=0.25
; WS camera auto-centering (turn behind travel + aim at the hero). 0 = off (default, like the ground camera with
; auto-centering off), 1 = on.
WALLSPRINT_CAMERA_AUTOCENTER=0
WALLSPRINT_ORIENTATION_WRITE=0
WALLSPRINT_ADHESION_WRITE=0
WALLSPRINT_MOVEMENT_WRITE=0
DEBUG_LOG=1
; v0.1c48 is a verified-WallRun read-only threshold diagnostic build.
; M2b (2026-11-04): accepted r4/r5 caller-local orientation source substitution is ON again (body Up = wall normal) so the
; sprint clip swapped into the WallRun loop stands on the wall. Actor Transform/movement/adhesion/gravity writes stay OFF.
; The c45 GravityOrientationOwner presence hook remains disabled after its bounded zero-hit result.
; c47 worker scalar observation remains, and c48 additionally counts exact pre-original Update entries where this+0x250 exceeds the two V8 consumer thresholds.
; The exact-entry probe performs one guarded 4-byte owner read, no pointer dereference, no game call, and no game write.
; No F11/F12 input or post-test waiting is required. F8 remains the emergency stop.

