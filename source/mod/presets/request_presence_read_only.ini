[WallSprint]
WALLSPRINT_ENABLE=0
WALLSPRINT_NATIVE_SOURCE_OVERRIDE=0
WALLSPRINT_ENTRY_DELAY=0.70
WALLSPRINT_ROTATE_TIME=0.25
WALLSPRINT_ORIENTATION_WRITE=0
WALLSPRINT_ADHESION_WRITE=0
WALLSPRINT_MOVEMENT_WRITE=0
DEBUG_LOG=1
; GravityOrientationOwner presence-only capture. No gameplay or gravity writes.
; Capture auto-starts after exact hook admission; no F11/F12 input is required.
; The worker persists up to 16 records every 500 ms during the script session.
; No post-test waiting is required; shutdown only attempts the final partial-batch flush.

[Diagnostics]
ORIENTATION_SOURCE_DISCOVERY=1
SOURCE_ARGUMENT_CAPTURE=0
SOURCE_OTHER_ARGUMENT_SNAPSHOTS=0
SOURCE_WINDOW_MS=2000
ORIENTATION_WRITER_TRACE=0
WRITER_TRACE_WINDOW_MS=350
WALLRUN_HOOK_DIAGNOSTIC=1
WALLRUN_OBJECT_DIAGNOSTIC=1
HOOK_WALLRUN_INIT=1
HOOK_WALLRUN_ENTRY=1
HOOK_WALLRUN_UPDATE=1
HOOK_WALLRUN_DEINIT=1
; Legacy setting name retained for compatibility; c45 observes GravityOrientationOwner.
REQUEST_PRESENCE_DIAGNOSTIC=1
SURFACE_PROBE_DIAGNOSTIC=0
ORIENTATION_DIAGNOSTIC=0
ORIENTATION_INTERVAL_MS=100
REFERENCE_AOB_AUDIT=1
